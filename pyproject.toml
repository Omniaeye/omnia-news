[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnia-news"
version = "0.3.1"
description = "Evidence-linked news decisions with local typed inference"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "OMNIA EYE Corporation"}]
dependencies = []

[project.optional-dependencies]
local = ["laya @ git+https://github.com/Omniaeye/omnia-laya.git@256eaf39550291dec7378d5a20078cc0d500e852"]

[project.scripts]
omnia-news = "omnia_news.cli:main"
omnia-news-batch = "omnia_news.batch:main"
omnia-news-query = "omnia_news.query:main"

[project.urls]
Repository = "https://github.com/Omniaeye/omnia-news"
Documentation = "https://github.com/Omniaeye/omnia-news/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnia_news = ["*.json"]

[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
